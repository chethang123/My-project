server.port=8080
spring.application.name=api-gateway

# RESTAURANT ROUTE
spring.cloud.gateway.routes[0].id=restaurant-route
spring.cloud.gateway.routes[0].uri=lb://RESTAURANT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/restaurants/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/restaurants/(?<segment>.*), /restaurants/${segment}

# ORDER ROUTE
spring.cloud.gateway.routes[1].id=order-route
spring.cloud.gateway.routes[1].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/orders/(?<segment>.*), /orders/${segment}

# CORS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
